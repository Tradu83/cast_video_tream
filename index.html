    <script>
        (function () {
            let styleEl;
            function injectKeyframes(distance) {
                if (!styleEl) {
                    styleEl = document.createElement('style');
                    document.head.appendChild(styleEl);
                }
                styleEl.textContent = `@keyframes marqueeAnim { 0% { transform: translateX(0); } 100% { transform: translateX(${distance}px); } }`;
            }
            window.setMarquee = function () {
                const textEl = document.getElementById('viewer-overlay');
                if (!textEl) return;
                const screenWidth = window.innerWidth;
                const textWidth = textEl.scrollWidth;
                const distance = screenWidth - textWidth;
                const duration = Math.max(6000, Math.min(40000, Math.abs(distance) * 12));
                injectKeyframes(distance);
                textEl.style.animation = `marqueeAnim ${duration}ms linear infinite alternate`;
            };
            window.addEventListener('resize', () => {
                clearTimeout(window.__marqueeResizeTimer);
                window.__marqueeResizeTimer = setTimeout(window.setMarquee, 150);
            });
        })();
    </script>

    <script>
        const CUSTOM_NAMESPACE = "urn:x-cast:com.tranduyen.chieuyoutube.custom";

        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        const ytPlayerContainer = document.getElementById('player');
        const iptvContainer = document.getElementById('iptv-container');
        const iptvVideo = document.getElementById('iptv-player');
        const iptvBanner = document.getElementById('iptv-banner');
        const iptvLoading = document.getElementById('iptv-loading');
        const viewerOverlay = document.getElementById('viewer-overlay');
        const rewardOverlay = document.getElementById('reward-overlay');
        const splashScreen = document.getElementById('splash-screen');

        let ytPlayer = null;
        let isYouTubeReady = false;
        let currentViewerName = null;
        const rewardAudio = new Audio('music.mp3');
        let rewardShown = false;
        let videoDuration = 0;
        let currentTime = 0;

        // Current Playback Mode: "YOUTUBE" or "IPTV" or "IDLE"
        let currentMode = "IDLE";
        let shakaPlayer = null;
        let bannerTimer = null;
        let activeChannelData = null;
        let currentAspectRatioIndex = 0;
        const aspectRatios = ["contain", "cover", "fill"];

        function log(message) {
            console.log('[Cast Receiver]', message);
        }

        // =========================================================================
        // 1. SHAKA PLAYER INITIALIZATION (FOR DASH, HLS, CLEARKEY DRM IPTV)
        // =========================================================================
        function initShakaPlayer() {
            if (typeof shaka === 'undefined') {
                log('Shaka player library not loaded');
                return;
            }
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                shakaPlayer = new shaka.Player(iptvVideo);
                shakaPlayer.addEventListener('error', onShakaError);

                // Register request filter to attach custom User-Agent if required by OTT server
                shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
                    if (activeChannelData && activeChannelData.userAgent) {
                        request.headers['User-Agent'] = activeChannelData.userAgent;
                    }
                });

                log('Shaka Player successfully initialized for IPTV');
            } else {
                log('Browser does not support Shaka Player EME/MSE');
            }
        }

        function onShakaError(event) {
            log('Shaka Error: ' + JSON.stringify(event.detail));
            hideIptvLoading();
            // Inform Android sender of error
            context.sendCustomMessage(CUSTOM_NAMESPACE, undefined, {
                type: "IPTV_ERROR",
                message: event.detail ? (event.detail.message || "Mã lỗi: " + event.detail.code) : "Lỗi giải mã luồng IPTV"
            });
        }

        initShakaPlayer();

        // =========================================================================
        // 2. YOUTUBE IFRAME API INITIALIZATION
        // =========================================================================
        window.onYouTubeIframeAPIReady = function() {
            log('YouTube IFrame API ready');
            ytPlayer = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 },
                events: {
                    'onStateChange': onPlayerStateChange,
                    'onReady': onPlayerReady,
                    'onError': onPlayerError
                }
            });
        };

        function onPlayerReady(event) {
            log('YouTube Player ready');
            isYouTubeReady = true;
        }

        function onPlayerError(event) {
            log(`YouTube Player error: ${event.data}`);
        }

        function checkVideoProgress() {
            if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
                const newCurrentTime = ytPlayer.getCurrentTime();
                const newVideoDuration = ytPlayer.getDuration();

                currentTime = newCurrentTime;
                videoDuration = newVideoDuration;

                if (newCurrentTime < currentTime - 5) {
                    rewardShown = false;
                }

                if (currentViewerName && !rewardShown && videoDuration > 0 && (videoDuration - currentTime) <= 10) {
                    if (window.rewardNotificationEnabled !== false) {
                        showRewardMessage(currentViewerName);
                        rewardShown = true;
                    }
                }
            }
        }

        function onPlayerStateChange(event) {
            log(`YouTube Player state: ${event.data}`);

            if (event.data === YT.PlayerState.PLAYING) {
                rewardShown = false;
                currentTime = 0;
                videoDuration = 0;

                if (window.progressInterval) clearInterval(window.progressInterval);
                window.progressInterval = setInterval(checkVideoProgress, 1000);
            }

            if (event.data === YT.PlayerState.PAUSED) {
                if (window.progressInterval) {
                    clearInterval(window.progressInterval);
                    window.progressInterval = null;
                }
            }

            if (event.data === YT.PlayerState.ENDED) {
                if (window.progressInterval) {
                    clearInterval(window.progressInterval);
                    window.progressInterval = null;
                }

                viewerOverlay.style.opacity = 0;
                viewerOverlay.style.animation = "none";

                const message = { type: "VIDEO_ENDED" };
                context.sendCustomMessage(CUSTOM_NAMESPACE, undefined, message);
                log('VIDEO_ENDED signal sent to Android app.');
            }
        }

        // =========================================================================
        // 3. IPTV PLAYBACK & CLEARKEY DRM LOGIC
        // =========================================================================
        function parseClearKey(licenseKey) {
            if (!licenseKey || typeof licenseKey !== 'string') return null;
            let trimmed = licenseKey.trim();

            // Strip any trailing pipe header like "|User-Agent=..."
            const pipeIndex = trimmed.indexOf('|');
            if (pipeIndex !== -1) {
                trimmed = trimmed.substring(0, pipeIndex).trim();
            }

            // Case A: JWK JSON string format
            if (trimmed.startsWith('{')) {
                try {
                    const parsed = JSON.parse(trimmed);
                    if (parsed.keys && Array.isArray(parsed.keys)) {
                        const map = {};
                        parsed.keys.forEach(k => {
                            if (k.kid && k.k) {
                                const hexKid = base64UrlToHex(k.kid);
                                const hexK = base64UrlToHex(k.k);
                                if (hexKid && hexK) {
                                    map[hexKid] = hexK;
                                }
                            }
                        });
                        if (Object.keys(map).length > 0) return map;
                    }
                } catch (e) {
                    log('Error parsing JWK JSON: ' + e.message);
                }
            }

            // Case B: hexId:hexKey format (supports single or multiple separated by comma, semicolon or newline)
            const pairs = trimmed.split(/[,;\n\r]+/);
            const map = {};
            for (const pair of pairs) {
                const cleanPair = pair.trim();
                if (cleanPair.includes(':')) {
                    const parts = cleanPair.split(':');
                    if (parts.length >= 2) {
                        const keyId = parts[0].trim().replace(/[- ]/g, '');
                        const key = parts[1].trim().replace(/[- ]/g, '');
                        if (keyId.length >= 16 && key.length >= 16) {
                            map[keyId] = key;
                        }
                    }
                }
            }
            if (Object.keys(map).length > 0) {
                return map;
            }

            return null;
        }

        function base64UrlToHex(str) {
            try {
                let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                const raw = atob(base64);
                let hex = '';
                for (let i = 0; i < raw.length; i++) {
                    const _hex = raw.charCodeAt(i).toString(16);
                    hex += (_hex.length === 2 ? _hex : '0' + _hex);
                }
                return hex;
            } catch (e) {
                return null;
            }
        }

        async function playIptvChannel(channelData) {
            log('Starting IPTV channel playback: ' + JSON.stringify(channelData));
            currentMode = "IPTV";
            activeChannelData = channelData;

            // 1. Hide Splash & YouTube Player
            if (splashScreen) splashScreen.style.display = 'none';
            if (ytPlayer && isYouTubeReady) {
                try { ytPlayer.stopVideo(); } catch (e) {}
            }
            ytPlayerContainer.style.display = 'none';

            // Clean up karaoke overlays
            viewerOverlay.style.opacity = 0;
            rewardAudio.pause();
            rewardAudio.currentTime = 0;

            // 2. Show IPTV Container & Loading
            iptvContainer.style.display = 'block';
            showIptvLoading("Đang kết nối luồng " + (channelData.channelName || "IPTV") + "...");

            const streamUrl = channelData.streamUrl;
            const licenseKey = channelData.licenseKey;

            // 3. Configure Shaka Player DRM & Buffering
            if (shakaPlayer) {
                try {
                    await shakaPlayer.unload();
                } catch (e) {}

                const clearKeys = parseClearKey(licenseKey);
                if (clearKeys) {
                    log('Configuring Shaka ClearKey DRM: ' + JSON.stringify(clearKeys));
                    shakaPlayer.configure({
                        drm: {
                            clearKeys: clearKeys
                        }
                    });
                } else {
                    shakaPlayer.configure({ drm: { clearKeys: {} } });
                }

                // Low-latency buffering optimization for live TV streams
                shakaPlayer.configure({
                    streaming: {
                        bufferingGoal: 6,
                        rebufferingGoal: 2,
                        bufferBehind: 10,
                        jumpLargeGaps: true,
                        stallEnabled: true,
                        retryParameters: {
                            maxAttempts: 5,
                            baseDelay: 1000,
                            backoffFactor: 1.5,
                            fuzzFactor: 0.5,
                            timeout: 10000
                        }
                    },
                    manifest: {
                        dash: {
                            ignoreMinBufferTime: true
                        }
                    }
                });

                // 4. Load Stream
                try {
                    await shakaPlayer.load(streamUrl);
                    log('IPTV stream loaded successfully into Shaka Player');
                    iptvVideo.play().catch(e => log('Autoplay note: ' + e.message));
                    hideIptvLoading();

                    // Show IPTV OSD Banner
                    showIptvBanner(channelData);

                    // Notify Android App
                    context.sendCustomMessage(CUSTOM_NAMESPACE, undefined, {
                        type: "IPTV_STARTED",
                        channelId: channelData.channelId || channelData.id,
                        channelName: channelData.channelName || channelData.name
                    });
                } catch (e) {
                    log('Error loading IPTV stream with Shaka: ' + e.message);
                    // Fallback to native video tag for standard HLS if browser supports it
                    if (streamUrl.includes('.m3u8') && iptvVideo.canPlayType('application/vnd.apple.mpegurl')) {
                        log('Trying native HLS fallback...');
                        iptvVideo.src = streamUrl;
                        iptvVideo.play().catch(err => log('Native play error: ' + err.message));
                        hideIptvLoading();
                        showIptvBanner(channelData);
                    } else {
                        hideIptvLoading();
                        onShakaError({ detail: e });
                    }
                }
            }
        }

        function showIptvBanner(data) {
            const logoEl = document.getElementById('iptv-banner-logo');
            const titleEl = document.getElementById('iptv-banner-title');
            const groupEl = document.getElementById('iptv-banner-group');
            const drmEl = document.getElementById('iptv-banner-drm');
            const formatEl = document.getElementById('iptv-banner-format');

            titleEl.textContent = data.channelName || data.name || "Kênh TV";
            groupEl.textContent = data.groupTitle || "Truyền hình 360TV";

            if (data.logoUrl && data.logoUrl.trim().length > 0) {
                logoEl.src = data.logoUrl;
                logoEl.style.display = 'block';
            } else {
                logoEl.style.display = 'none';
            }

            if (data.licenseKey && data.licenseKey.trim().length > 0) {
                drmEl.textContent = "ClearKey DRM";
                drmEl.style.display = 'inline-block';
            } else {
                drmEl.style.display = 'none';
            }

            const streamUrl = (data.streamUrl || "").toLowerCase();
            if (streamUrl.includes('.mpd')) {
                formatEl.textContent = "DASH Live";
            } else if (streamUrl.includes('.m3u8')) {
                formatEl.textContent = "HLS Stream";
            } else {
                formatEl.textContent = "Adaptive Live";
            }

            iptvBanner.classList.add('visible');

            if (bannerTimer) clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => {
                iptvBanner.classList.remove('visible');
            }, 5000);
        }

        function showIptvLoading(text) {
            const textEl = document.getElementById('iptv-loading-text');
            if (textEl && text) textEl.textContent = text;
            iptvLoading.style.display = 'flex';
        }

        function hideIptvLoading() {
            iptvLoading.style.display = 'none';
        }

        function cycleAspectRatio() {
            currentAspectRatioIndex = (currentAspectRatioIndex + 1) % aspectRatios.length;
            const mode = aspectRatios[currentAspectRatioIndex];
            iptvVideo.style.objectFit = mode;
            log('Aspect ratio changed to: ' + mode);
        }

        function stopIptv() {
            if (shakaPlayer) {
                try { shakaPlayer.unload(); } catch(e) {}
            }
            iptvVideo.pause();
            iptvVideo.removeAttribute('src');
            iptvContainer.style.display = 'none';
            iptvBanner.classList.remove('visible');
            hideIptvLoading();
            activeChannelData = null;
            currentMode = "IDLE";
            if (splashScreen) splashScreen.style.display = 'flex';
        }

        // =========================================================================
        // 4. YOUTUBE LOAD VIDEO
        // =========================================================================
        function loadVideoFromMessage(media) {
            log('Loading YouTube video from message: ' + JSON.stringify(media));
            // Stop IPTV if active
            stopIptv();
            currentMode = "YOUTUBE";

            ytPlayerContainer.style.display = 'block';
            rewardAudio.pause();
            rewardAudio.currentTime = 0;

            if (window.progressInterval) {
                clearInterval(window.progressInterval);
                window.progressInterval = null;
            }

            rewardShown = false;
            currentTime = 0;
            videoDuration = 0;

            if (splashScreen) splashScreen.style.display = 'none';

            const videoId = media.contentId;
            const customData = media.customData || {};

            if (isYouTubeReady && ytPlayer && videoId) {
                ytPlayer.loadVideoById({ videoId: videoId, suggestedQuality: 'hd1080' });
            }

            currentViewerName = customData.viewerName;
            if (currentViewerName) {
                viewerOverlay.textContent = `Trình bày: ${currentViewerName}`;
                viewerOverlay.style.opacity = 1;
                setTimeout(setMarquee, 0);
            } else {
                viewerOverlay.textContent = "";
                viewerOverlay.style.opacity = 0;
                viewerOverlay.style.animation = "none";
            }
        }

        // =========================================================================
        // 5. CUSTOM MESSAGE LISTENER (COMMUNICATION WITH ANDROID SENDER)
        // =========================================================================
        context.addCustomMessageListener(CUSTOM_NAMESPACE, event => {
            const data = event.data;
            log(`Received custom message from sender: ${JSON.stringify(data)}`);

            if (data.type === "PLAY_IPTV") {
                playIptvChannel(data);
            } else if (data.type === "STOP_IPTV") {
                stopIptv();
            } else if (data.type === "PAUSE_IPTV") {
                iptvVideo.pause();
            } else if (data.type === "RESUME_IPTV") {
                iptvVideo.play();
            } else if (data.type === "TOGGLE_IPTV") {
                if (iptvVideo.paused) iptvVideo.play(); else iptvVideo.pause();
            } else if (data.type === "CYCLE_ASPECT_RATIO") {
                cycleAspectRatio();
            } else if (data.type === "SHOW_OSD") {
                if (activeChannelData) {
                    showIptvBanner(activeChannelData);
                } else {
                    showIptvBanner(data);
                }
            } else if (data.type === "JUMP_TO" || data.type === "PLAY_NEXT") {
                if (data.media) {
                    loadVideoFromMessage(data.media);
                }
            } else if (data.type === "REWARD_NOTIFICATION_STATUS") {
                window.rewardNotificationEnabled = data.enabled;
            }
        });

        // =========================================================================
        // 6. CAF RECEIVER INTERCEPTORS
        // =========================================================================
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            loadRequestData => {
                log('Standard LOAD command received: ' + JSON.stringify(loadRequestData.media));
                const media = loadRequestData.media;
                if (!media) return null;

                const customData = media.customData || {};
                const contentType = media.contentType || "";

                // Check if this is an IPTV stream request
                if (customData.mediaType === "IPTV" || customData.type === "PLAY_IPTV" ||
                    contentType.includes("dash") || contentType.includes("mpegurl") ||
                    (media.contentId && (media.contentId.startsWith("http://") || media.contentId.startsWith("https://")))) {
                    
                    const iptvData = {
                        streamUrl: customData.streamUrl || media.contentId,
                        channelName: customData.channelName || (media.metadata ? media.metadata.title : "Kênh IPTV"),
                        groupTitle: customData.groupTitle || (media.metadata ? media.metadata.subtitle : "Truyền hình 360TV"),
                        logoUrl: customData.logoUrl || (media.metadata && media.metadata.images && media.metadata.images[0] ? media.metadata.images[0].url : ""),
                        licenseKey: customData.licenseKey || ""
                    };
                    playIptvChannel(iptvData);
                    return null;
                }

                // Default to YouTube Karaoke video
                loadVideoFromMessage(media);
                return null;
            }
        );

        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.PLAY,
            () => {
                if (currentMode === "IPTV") {
                    iptvVideo.play();
                } else if (ytPlayer) {
                    ytPlayer.playVideo();
                }
                return null;
            }
        );

        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.PAUSE,
            () => {
                if (currentMode === "IPTV") {
                    iptvVideo.pause();
                } else if (ytPlayer) {
                    ytPlayer.pauseVideo();
                }
                return null;
            }
        );

        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.STOP,
            () => {
                if (currentMode === "IPTV") {
                    stopIptv();
                } else if (ytPlayer) {
                    ytPlayer.stopVideo();
                }
                return null;
            }
        );

        // =========================================================================
        // 7. KARAOKE REWARD POPUP
        // =========================================================================
        function showRewardMessage(viewerName) {
            const startScore = 20;
            const finalScore = Math.floor(Math.random() * 16) + 85;
            let currentScore = startScore;

            rewardOverlay.innerHTML =
                `<div class="reward-text-blue">Ca sỹ ${viewerName} đã thể hiện bài hát rất tốt,</div>` +
                `<div class="reward-text-blue">điểm khen ngợi</div>` +
                `<div class="reward-score-red"><span id="score-counter">${startScore}</span> điểm</div>`;

            const scoreElement = document.getElementById('score-counter');
            rewardOverlay.style.opacity = 1;
            log(`Showing reward message for ${viewerName}. Counting from ${startScore} to ${finalScore}`);

            rewardAudio.currentTime = 0;
            rewardAudio.play().catch(e => log('Audio play error: ' + e.message));

            const counterInterval = setInterval(() => {
                if (currentScore < finalScore) {
                    currentScore++;
                    scoreElement.textContent = currentScore;
                } else {
                    clearInterval(counterInterval);
                }
            }, 50);

            setTimeout(() => {
                rewardOverlay.style.opacity = 0;
                clearInterval(counterInterval);
            }, 10000);
        }

        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        context.start(options);
        log('Cast receiver initialized and running successfully with YouTube Karaoke & IPTV 360TV support.');
    </script>
</body>
</html>
