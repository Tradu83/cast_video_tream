    <script>
        (function () {
            let styleEl;
            function injectKeyframes(distance) {
                if (!styleEl) {
                    styleEl = document.createElement('style');
                    document.head.appendChild(styleEl);
                }
                styleEl.textContent = `@keyframes marqueeAnim { 0% { transform: translateX(0); } 100% { transform: translateX(${distance}px); } }`;
            }
            window.setMarquee = function () {
                const textEl = document.getElementById('viewer-overlay');
                if (!textEl) return;
                const screenWidth = window.innerWidth;
                const textWidth = textEl.scrollWidth;
                const distance = screenWidth - textWidth;
                const duration = Math.max(6000, Math.min(40000, Math.abs(distance) * 12));
                injectKeyframes(distance);
                textEl.style.animation = `marqueeAnim ${duration}ms linear infinite alternate`;
            };
            window.addEventListener('resize', () => {
                clearTimeout(window.__marqueeResizeTimer);
                window.__marqueeResizeTimer = setTimeout(window.setMarquee, 150);
            });
        })();

        // [MỚI] Hàm trích xuất ID YouTube chuẩn xác từ mọi loại link
        window.extractYouTubeId = function(url) {
            if (!url || typeof url !== 'string') return null;
            if (url.length === 11 && !url.includes('://') && !url.includes('/')) return url;
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
            return match ? match[1] : null;
        };
    </script>

    <script>
        const CUSTOM_NAMESPACE = "urn:x-cast:com.tranduyen.chieuyoutube.custom";

        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        const ytPlayerContainer = document.getElementById('player');
        const iptvContainer = document.getElementById('iptv-container');
        const iptvVideo = document.getElementById('iptv-player');
        const iptvBanner = document.getElementById('iptv-banner');
        const iptvLoading = document.getElementById('iptv-loading');
        const photoContainer = document.getElementById('photo-container');
        const photoImg = document.getElementById('photo-img');
        const photoBanner = document.getElementById('photo-banner');
        const photoTitle = document.getElementById('photo-title');
        const photoCounter = document.getElementById('photo-counter');
        const photoRotationText = document.getElementById('photo-rotation-text');

        const viewerOverlay = document.getElementById('viewer-overlay');
        const rewardOverlay = document.getElementById('reward-overlay');
        const splashScreen = document.getElementById('splash-screen');

        let ytPlayer = null;
        let isYouTubeReady = false;
        let currentViewerName = null;
        const rewardAudio = new Audio('music.mp3');
        let rewardShown = false;
        let videoDuration = 0;
        let currentTime = 0;

        // Current Playback Mode: "YOUTUBE" or "IPTV" or "PHOTO" or "LOCAL_VIDEO" or "KARAOKE_DIRECT" or "IDLE"
        let currentMode = "IDLE";
        let shakaPlayer = null;
        let currentHlsInstance = null;
        let currentMpegtsInstance = null;
        let currentFlvInstance = null;
        let activeEngine = "NONE";
        let bannerTimer = null;
        let photoBannerTimer = null;
        let activeChannelData = null;
        let currentAspectRatioIndex = 0;
        const aspectRatios = ["contain", "cover", "fill"];
        let lastPlayRequest = { url: null, timestamp: 0 };
        let currentPhotoRotation = 0;

        function log(message) {
            console.log('[Cast Receiver]', message);
        }

        // YouTube IFrame API Ready Callback
        window.onYouTubeIframeAPIReady = function() {
            log('YouTube IFrame API Ready, initializing player...');
            try {
                ytPlayer = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    playerVars: {
                        autoplay: 1,
                        controls: 0,
                        enablejsapi: 1,
                        rel: 0,
                        showinfo: 0,
                        iv_load_policy: 3,
                        modestbranding: 1,
                        fs: 0
                    },
                    events: {
                        onReady: function() {
                            log('YouTube Player Ready');
                            isYouTubeReady = true;
                            if (window.pendingYouTubeVideoId) {
                                ytPlayer.loadVideoById({
                                    videoId: window.pendingYouTubeVideoId,
                                    suggestedQuality: 'hd1080'
                                });
                                window.pendingYouTubeVideoId = null;
                            }
                        },
                        onStateChange: function(event) {
                            if (event.data === YT.PlayerState.PLAYING) {
                                log('YouTube Player playing');
                            } else if (event.data === YT.PlayerState.ENDED) {
                                log('YouTube Player ended, triggering VIDEO_ENDED');
                                if (currentViewerName && window.rewardNotificationEnabled) {
                                    showRewardMessage(currentViewerName);
                                }
                                context.sendCustomMessage(CUSTOM_NAMESPACE, undefined, {
                                    type: "VIDEO_ENDED"
                                });
                            }
                        },
                        onError: function(event) {
                            log('YouTube Player error code: ' + event.data);
                            context.sendCustomMessage(CUSTOM_NAMESPACE, undefined, {
                                type: "VIDEO_ENDED"
                            });
                        }
                    }
                });
            } catch (e) {
                log('Error initializing YouTube Player: ' + e.message);
            }
        };

        // =========================================================================
        // ENSURE AUDIO AND VIDEO PLAYBACK
        // =========================================================================
        iptvVideo.addEventListener('playing', () => {
            log('iptvVideo event: playing. Audio volume=' + iptvVideo.volume + ', muted=' + iptvVideo.muted);
            hideIptvLoading();
            if (iptvVideo.muted) {
                iptvVideo.muted = false;
            }
        });

        iptvVideo.addEventListener('canplay', () => {
            log('iptvVideo event: canplay');
            hideIptvLoading();
        });

        iptvVideo.addEventListener('error', (e) => {
            log('iptvVideo DOM error: ' + (iptvVideo.error ? iptvVideo.error.message : 'Unknown'));
        });

        iptvVideo.addEventListener('ended', () => {
            log('iptvVideo event: ended. currentMode=' + currentMode);
            if (currentMode === "KARAOKE_DIRECT" || currentMode === "LOCAL_VIDEO") {
                if (currentViewerName && window.rewardNotificationEnabled) {
                    showRewardMessage(currentViewerName);
                }
                context.sendCustomMessage(CUSTOM_NAMESPACE, undefined, {
                    type: "VIDEO_ENDED"
                });
            }
        });

        // =========================================================================
        // 1. SHAKA PLAYER INITIALIZATION (FOR DASH, CLEARKEY DRM IPTV)
        // =========================================================================
        function initShakaPlayer() {
            if (typeof shaka === 'undefined') {
                log('Shaka player library not loaded');
                return;
            }
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                shakaPlayer = new shaka.Player(iptvVideo);
                shakaPlayer.addEventListener('error', onShakaError);
                log('Shaka Player successfully initialized for IPTV');
            } else {
                log('Browser does not support Shaka Player EME/MSE');
            }
        }

        function onShakaError(event) {
            log('Shaka Error: ' + JSON.stringify(event.detail));
        }

        initShakaPlayer();

        // =========================================================================
        // 2. MULTI-ENGINE IPTV & VIDEO PLAYBACK
        // =========================================================================

        function resetVideoElement() {
            try {
                iptvVideo.pause();
                iptvVideo.removeAttribute('src');
                if (iptvVideo.srcObject) {
                    iptvVideo.srcObject = null;
                }
                iptvVideo.load();
            } catch (e) {}
            iptvVideo.muted = false;
            iptvVideo.volume = 1.0;
        }

        function cleanupCurrentIptvPlayer() {
            log('Cleaning up previous IPTV player instances...');
            if (currentHlsInstance) {
                try {
                    currentHlsInstance.stopLoad();
                    currentHlsInstance.detachMedia();
                    currentHlsInstance.destroy();
                } catch (e) {}
                currentHlsInstance = null;
            }
            if (currentMpegtsInstance) {
                try {
                    currentMpegtsInstance.pause();
                    currentMpegtsInstance.unload();
                    currentMpegtsInstance.detachMediaElement();
                    currentMpegtsInstance.destroy();
                } catch (e) {}
                currentMpegtsInstance = null;
            }
            if (currentFlvInstance) {
                try {
                    currentFlvInstance.pause();
                    currentFlvInstance.unload();
                    currentFlvInstance.detachMediaElement();
                    currentFlvInstance.destroy();
                } catch (e) {}
                currentFlvInstance = null;
            }
            if (shakaPlayer) {
                try { 
                    shakaPlayer.unload(); 
                    // Reset request filter để tránh lưu header rác
                    shakaPlayer.getNetworkingEngine().clearAllRequestFilters();
                } catch (e) {}
            }
            resetVideoElement();
            activeEngine = "NONE";
        }

        function notifyIptvStarted(data) {
            context.sendCustomMessage(CUSTOM_NAMESPACE, undefined, {
                type: "IPTV_STARTED",
                channelId: data.channelId || data.id,
                channelName: data.channelName || data.name,
                engine: activeEngine
            });
        }

        function notifyIptvError(msg) {
            context.sendCustomMessage(CUSTOM_NAMESPACE, undefined, {
                type: "IPTV_ERROR",
                message: msg
            });
        }

        function parseClearKey(licenseKey) {
            if (!licenseKey || typeof licenseKey !== 'string') return null;
            let trimmed = licenseKey.trim();

            const pipeIndex = trimmed.indexOf('|');
            if (pipeIndex !== -1) {
                trimmed = trimmed.substring(0, pipeIndex).trim();
            }

            if (trimmed.startsWith('{')) {
                try {
                    const parsed = JSON.parse(trimmed);
                    if (parsed.keys && Array.isArray(parsed.keys)) {
                        const map = {};
                        parsed.keys.forEach(k => {
                            if (k.kid && k.k) {
                                const hexKid = base64UrlToHex(k.kid);
                                const hexK = base64UrlToHex(k.k);
                                if (hexKid && hexK) {
                                    map[hexKid] = hexK;
                                }
                            }
                        });
                        if (Object.keys(map).length > 0) return map;
                    }
                } catch (e) {
                    log('Error parsing JWK JSON: ' + e.message);
                }
            }

            const pairs = trimmed.split(/[,;\n\r]+/);
            const map = {};
            for (const pair of pairs) {
                const cleanPair = pair.trim();
                if (cleanPair.includes(':')) {
                    const parts = cleanPair.split(':');
                    if (parts.length >= 2) {
                        const keyId = parts[0].trim().replace(/[- ]/g, '');
                        const key = parts[1].trim().replace(/[- ]/g, '');
                        if (keyId.length >= 16 && key.length >= 16) {
                            map[keyId] = key;
                        }
                    }
                }
            }
            if (Object.keys(map).length > 0) return map;

            return null;
        }

        function base64UrlToHex(str) {
            try {
                let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                const raw = atob(base64);
                let hex = '';
                for (let i = 0; i < raw.length; i++) {
                    const _hex = raw.charCodeAt(i).toString(16);
                    hex += (_hex.length === 2 ? _hex : '0' + _hex);
                }
                return hex;
            } catch (e) {
                return null;
            }
        }

                        accurateSeek: false,
                        seekType: 'range'

                            showIptvBanner(channelData);

                    }).catch(err => {

                        if (!resolved) {
                            resolved = true;
                            try { player.destroy(); } catch (e) {}
                            currentMpegtsInstance = null;
                            resolve(false);
                        }

                    setTimeout(() => {
                        if (!resolved) {
                            if (!iptvVideo.paused && iptvVideo.currentTime > 0) {
                                resolved = true;
                                activeEngine = "MPEGTS";
                                hideIptvLoading();
                                showIptvBanner(channelData);
                                notifyIptvStarted(channelData);
                                resolve(true);

                                resolved = true;
                                log('MPEGTS.js playback timeout, falling back');
                                try { player.destroy(); } catch (e) {}
                                currentMpegtsInstance = null;

                    }, 5500);

                } catch (e) {
                    log('MPEGTS.js setup exception: ' + e.message);

        async function playWithHlsJs(streamUrl, channelData) {
            log('Attempting playback with Hls.js: ' + streamUrl);
            if (typeof Hls === 'undefined' || !Hls.isSupported()) {
                log('Hls.js is not supported in this browser');
                return false;
            }

            return new Promise((resolve) => {
                let resolved = false;
                let fatalRetryCount = 0;
                try {
                    const hlsOptions = {
                        enableWorker: false,
                        lowLatencyMode: true,
                        backBufferLength: 30,
                        liveSyncDurationCount: 3,
                        liveMaxLatencyDurationCount: 8,
                        maxBufferLength: 15,
                        maxMaxBufferLength: 30,
                        manifestLoadingMaxRetry: 3,
                        manifestLoadingRetryDelay: 800,
                        fragLoadingMaxRetry: 4,
                        fragLoadingRetryDelay: 800
                    };
                    
                    // [MỚI] Hỗ trợ chèn Header cho Hls.js
                    if (channelData.headers && Object.keys(channelData.headers).length > 0) {
                        hlsOptions.xhrSetup = function(xhr, url) {
                            for (const key in channelData.headers) {
                                try { xhr.setRequestHeader(key, channelData.headers[key]); } catch(e) {}
                            }
                        };
                    }

                    const hls = new Hls(hlsOptions);

                    currentHlsInstance = hls;
                    hls.attachMedia(iptvVideo);

                    hls.on(Hls.Events.MEDIA_ATTACHED, function () {
                        hls.loadSource(streamUrl);
                    });

                    hls.on(Hls.Events.MANIFEST_PARSED, function () {
                        log('HLS manifest parsed successfully by Hls.js');
                        iptvVideo.muted = false;
                        iptvVideo.volume = 1.0;
                        iptvVideo.play().then(() => {
                            if (!resolved) {
                                resolved = true;
                                activeEngine = "HLS";
                                hideIptvLoading();
                                showIptvBanner(channelData);
                                notifyIptvStarted(channelData);
                                resolve(true);
                            }
                        }).catch(err => {
                            log('Hls.js play() note: ' + err.message);
                            if (!resolved) {
                                resolved = true;
                                activeEngine = "HLS";
                                hideIptvLoading();
                                showIptvBanner(channelData);
                                notifyIptvStarted(channelData);
                                resolve(true);
                            }
                        });
                    });

                    hls.on(Hls.Events.ERROR, function (event, data) {
                        log('Hls.js error: ' + data.type + ' / ' + data.details + ' / fatal=' + data.fatal);
                        if (data.fatal) {
                            fatalRetryCount++;
                            if (fatalRetryCount <= 2) {
                                switch (data.type) {
                                    case Hls.ErrorTypes.NETWORK_ERROR:
                                        log('Hls.js recovering from network error...');
                                        hls.startLoad();
                                        break;
                                    case Hls.ErrorTypes.MEDIA_ERROR:
                                        log('Hls.js recovering from media error...');
                                        hls.recoverMediaError();
                                        break;
                                    default:
                                        if (!resolved) {
                                            resolved = true;
                                            hls.destroy();
                                            currentHlsInstance = null;
                                            resolve(false);
                                        }
                                        break;
                                }
                            } else {
                                log('Hls.js fatal retries exceeded, falling back...');
                                if (!resolved) {
                                    resolved = true;
                                    hls.destroy();
                                    currentHlsInstance = null;
                                    resolve(false);
                                }
                            }
                        }
                    });

                    setTimeout(() => {
                        if (!resolved) {
                            if (!iptvVideo.paused && iptvVideo.currentTime > 0) {
                                resolved = true;
                                activeEngine = "HLS";
                                hideIptvLoading();
                                showIptvBanner(channelData);
                                notifyIptvStarted(channelData);
                                resolve(true);
                            } else {
                                resolved = true;
                                log('Hls.js timeout waiting for MANIFEST_PARSED, falling back');
                                try { hls.destroy(); } catch (e) {}
                                currentHlsInstance = null;
                                resolve(false);
                            }
                        }
                    }, 6500);
                } catch (e) {
                    log('Hls.js setup error: ' + e.message);
                    if (!resolved) {
                        resolved = true;
                        resolve(false);
                    }
                }
            });
        }

        async function playWithShaka(streamUrl, channelData) {
            log('Attempting playback with Shaka Player: ' + streamUrl);
            if (!shakaPlayer) return false;

            try {
                // [MỚI] Xử lý chèn Header cho luồng DASH/MPD
                if (channelData.headers && Object.keys(channelData.headers).length > 0) {
                    shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
                        for (const key in channelData.headers) {
                            request.headers[key] = channelData.headers[key];
                        }
                    });
                }

                // CẤU HÌNH DRM
                const clearKeys = parseClearKey(channelData.licenseKey);
                if (clearKeys) {
                    log('Configuring Shaka ClearKey DRM: ' + JSON.stringify(clearKeys));
                    shakaPlayer.configure({ drm: { clearKeys: clearKeys } });
                } else {
                    shakaPlayer.configure({ drm: { clearKeys: {} } });
                }

                shakaPlayer.configure({
                    streaming: {
                        bufferingGoal: 6,
                        rebufferingGoal: 2,
                        bufferBehind: 10,
                        jumpLargeGaps: true,
                        stallEnabled: true,
                        retryParameters: {
                            maxAttempts: 3,
                            baseDelay: 800,
                            backoffFactor: 1.5,
                            fuzzFactor: 0.5,
                            timeout: 8000
                        }
                    },
                    manifest: {
                        dash: { ignoreMinBufferTime: true },
                        hls: { ignoreTextStreamFailures: true, ignoreImageStreamFailures: true }
                    }
                });

                await shakaPlayer.load(streamUrl);
                activeEngine = "SHAKA";
                log('Shaka Player loaded stream successfully');
                iptvVideo.muted = false;
                iptvVideo.volume = 1.0;
                iptvVideo.play().catch(e => log('Shaka play note: ' + e.message));
                hideIptvLoading();
                showIptvBanner(channelData);
                notifyIptvStarted(channelData);
                return true;
            } catch (e) {
                log('Shaka Player error loading stream: ' + e.message);
                return false;
            }
        }

        async function playWithNativeVideo(streamUrl, channelData) {
            log('Attempting Native HTML5 Video element playback: ' + streamUrl);
            resetVideoElement();
            return new Promise((resolve) => {
                let resolved = false;
                const onPlaying = () => {
                    if (!resolved) {
                        resolved = true;
                        cleanupListeners();
                        activeEngine = "NATIVE";
                        log('Native HTML5 video playback started successfully');
                        hideIptvLoading();
                        showIptvBanner(channelData);
                        notifyIptvStarted(channelData);
                        resolve(true);
                    }
                };
                const onError = (e) => {
                    if (!resolved) {
                        resolved = true;
                        cleanupListeners();
                        log('Native video element error');
                        resolve(false);
                    }
                };
                function cleanupListeners() {
                    iptvVideo.removeEventListener('playing', onPlaying);
                    iptvVideo.removeEventListener('canplay', onPlaying);
                    iptvVideo.removeEventListener('error', onError);
                }
                iptvVideo.addEventListener('playing', onPlaying);
                iptvVideo.addEventListener('canplay', onPlaying);
                iptvVideo.addEventListener('error', onError);

                iptvVideo.src = streamUrl;
                iptvVideo.muted = false;
                iptvVideo.volume = 1.0;

                const playPromise = iptvVideo.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        onPlaying();
                    }).catch(err => {
                        log('Native play promise error: ' + err.message);
                        iptvVideo.muted = true;
                        iptvVideo.play().then(() => {
                            setTimeout(() => { iptvVideo.muted = false; }, 300);
                            onPlaying();
                        }).catch(() => onError(err));
                    });
                }

                setTimeout(() => {
                    if (!resolved) {
                        if (!iptvVideo.paused && iptvVideo.currentTime > 0) {
                            onPlaying();
                        } else {
                            resolved = true;
                            cleanupListeners();
                            resolve(false);
                        }
                    }
                }, 6000);
            });
        }

        // =========================================================================
        // 3. MASTER ADAPTIVE PLAYBACK CONTROLLER
        // =========================================================================
        async function playIptvChannel(channelData) {
            const rawUrl = (channelData.streamUrl || "").trim();
            if (!rawUrl) {
                hideIptvLoading();
                notifyIptvError("Đường dẫn luồng video rỗng!");
                return;
            }

            const now = Date.now();
            if (lastPlayRequest.url === rawUrl && (now - lastPlayRequest.timestamp) < 1800) {
                log('Ignoring duplicate rapid play request for: ' + rawUrl);
                return;
            }
            lastPlayRequest = { url: rawUrl, timestamp: now };

            log('Starting adaptive IPTV playback for: ' + JSON.stringify(channelData));
            currentMode = "IPTV";
            activeChannelData = channelData;

            // 1. Hide Splash, YouTube & Photo Layer
            if (splashScreen) splashScreen.style.display = 'none';
            if (photoContainer) photoContainer.style.display = 'none';
            if (ytPlayer && isYouTubeReady) {
                try { ytPlayer.stopVideo(); } catch (e) {}
            }
            ytPlayerContainer.style.display = 'none';

            // Clean up karaoke overlays
            viewerOverlay.style.opacity = 0;
            rewardAudio.pause();
            rewardAudio.currentTime = 0;

            // 2. Show IPTV Container & Loading
            iptvContainer.style.display = 'block';
            showIptvLoading("Đang kết nối: " + (channelData.channelName || "Kênh TV") + "...");

            // 3. Clean up any currently running player engine
            cleanupCurrentIptvPlayer();

            const urlLower = rawUrl.toLowerCase();
            const manifestType = (channelData.manifestType || "").toLowerCase();
            const isDrm = Boolean(channelData.licenseKey && channelData.licenseKey.trim().length > 0);

            let success = false;

            if (urlLower.includes('.flv') || manifestType === 'flv') {
                log('Executing FLV playback pipeline...');
                success = await playWithMpegts(rawUrl, channelData);
                if (!success) {
                    log('MPEGTS.js failed, trying Flv.js...');
                    success = await playWithFlvJs(rawUrl, channelData);
                }
                if (!success && rawUrl.includes('.flv')) {
                    const altM3u8 = rawUrl.replace(/\.flv(\?.*)?$/i, '.m3u8$1');
                    log('Trying CDN alternative HLS stream: ' + altM3u8);
                    success = await playWithHlsJs(altM3u8, channelData);
                    if (!success) {
                        success = await playWithNativeVideo(altM3u8, channelData);
                    }
                }
                if (!success) {
                    log('Trying native video element for FLV...');
                    success = await playWithNativeVideo(rawUrl, channelData);
                }
            }
            else if (isDrm || urlLower.includes('.mpd') || manifestType === 'mpd') {
                log('Executing DASH/ClearKey DRM pipeline...');
                success = await playWithShaka(rawUrl, channelData);
                if (!success) {
                    log('Shaka failed for MPD, trying Hls.js...');
                    success = await playWithHlsJs(rawUrl, channelData);
                }
                if (!success) {
                    log('Hls.js failed, trying Native Video...');
                    success = await playWithNativeVideo(rawUrl, channelData);
                }
            }
            else if (urlLower.includes('.m3u8') || urlLower.includes('.m3u') || manifestType === 'hls') {
                log('Executing Live HLS pipeline...');
                success = await playWithHlsJs(rawUrl, channelData);
                if (!success) {
                    log('Hls.js failed for HLS, trying Shaka Player...');
                    success = await playWithShaka(rawUrl, channelData);
                }
                if (!success) {
                    log('Shaka failed for HLS, trying Native Hardware Video...');
                    success = await playWithNativeVideo(rawUrl, channelData);
                }
            }
            else if (urlLower.includes('.ts') || manifestType === 'ts') {
                log('Executing MPEG-TS pipeline...');
                success = await playWithMpegts(rawUrl, channelData);
                if (!success) {
                    success = await playWithHlsJs(rawUrl, channelData);
                }
                if (!success) {
                    success = await playWithNativeVideo(rawUrl, channelData);
                }
            }
            else {
                log('Executing Generic Stream pipeline...');
                success = await playWithHlsJs(rawUrl, channelData);
                if (!success) success = await playWithShaka(rawUrl, channelData);
                if (!success) success = await playWithMpegts(rawUrl, channelData);
                if (!success) success = await playWithFlvJs(rawUrl, channelData);
                if (!success) success = await playWithNativeVideo(rawUrl, channelData);
            }

            if (!success) {
                log('All playback engines failed to load stream: ' + rawUrl);
                hideIptvLoading();
                notifyIptvError("Không thể phát luồng TV này trên TV. Máy chủ nguồn có thể đang bảo trì hoặc chặn kết nối ngoài.");
            }
        }

        function showIptvBanner(data) {
            // KHÔNG hiện banner OSD IPTV nếu đang ở chế độ hát Karaoke
            if (currentMode === "KARAOKE_DIRECT") return;

            const logoEl = document.getElementById('iptv-banner-logo');
            const titleEl = document.getElementById('iptv-banner-title');
            const groupEl = document.getElementById('iptv-banner-group');
            const drmEl = document.getElementById('iptv-banner-drm');
            const formatEl = document.getElementById('iptv-banner-format');

            titleEl.textContent = data.channelName || data.name || "Kênh TV";
            groupEl.textContent = data.groupTitle || "Truyền hình 360TV";

            if (data.logoUrl && data.logoUrl.trim().length > 0) {
                logoEl.src = data.logoUrl;
                logoEl.style.display = 'block';
            } else {
                logoEl.style.display = 'none';
            }

            if (data.licenseKey && data.licenseKey.trim().length > 0) {
                drmEl.textContent = "ClearKey DRM";
                drmEl.style.display = 'inline-block';
            } else {
                drmEl.style.display = 'none';
            }

            const streamUrl = (data.streamUrl || "").toLowerCase();
            const manifestType = (data.manifestType || "").toLowerCase();
            let formatText = "Adaptive Live";
            if (activeEngine === "MPEGTS" || activeEngine === "FLVJS" || streamUrl.includes('.flv') || manifestType === 'flv') {
                formatText = "HTTP-FLV Live (" + activeEngine + ")";
            } else if (activeEngine === "SHAKA" || streamUrl.includes('.mpd') || manifestType === 'mpd') {
                formatText = "DASH Live (Shaka)";
            } else if (activeEngine === "HLS" || streamUrl.includes('.m3u8') || manifestType === 'hls') {
                formatText = "HLS Stream (Hls.js)";
            } else if (activeEngine === "NATIVE") {
                formatText = "Direct Hardware (Native)";
            }
            formatEl.textContent = formatText;

            iptvBanner.classList.add('visible');

            if (bannerTimer) clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => {
                iptvBanner.classList.remove('visible');
            }, 5000);
        }

        function showIptvLoading(text) {
            const textEl = document.getElementById('iptv-loading-text');
            if (textEl && text) textEl.textContent = text;
            iptvLoading.style.display = 'flex';
        }

        function hideIptvLoading() {
            iptvLoading.style.display = 'none';
        }

        function cycleAspectRatio() {
            currentAspectRatioIndex = (currentAspectRatioIndex + 1) % aspectRatios.length;
            const mode = aspectRatios[currentAspectRatioIndex];
            iptvVideo.style.objectFit = mode;
            log('Aspect ratio changed to: ' + mode);
        }

        function stopIptv() {
            cleanupCurrentIptvPlayer();
            const existingAudio = document.getElementById('iptv-audio');
            if (existingAudio) {
                existingAudio.pause();
                existingAudio.removeAttribute('src');
                existingAudio.remove();
            }
            iptvContainer.style.display = 'none';
            iptvBanner.classList.remove('visible');
            hideIptvLoading();
            activeChannelData = null;
            if (currentMode === "IPTV" || currentMode === "KARAOKE_DIRECT") {
                currentMode = "IDLE";
                if (splashScreen) splashScreen.style.display = 'flex';
            }
        }

        function pauseIptv() {
            if (currentMpegtsInstance) {
                try { currentMpegtsInstance.pause(); } catch (e) {}
            }
            if (currentFlvInstance) {
                try { currentFlvInstance.pause(); } catch (e) {}
            }
            iptvVideo.pause();
        }

        function resumeIptv() {
            if (currentMpegtsInstance) {
                try { currentMpegtsInstance.play(); } catch (e) {}
            }
            if (currentFlvInstance) {
                try { currentFlvInstance.play(); } catch (e) {}
            }
            iptvVideo.muted = false;
            iptvVideo.volume = 1.0;
            iptvVideo.play().catch(e => log('Resume note: ' + e.message));
        }

        }

        // =========================================================================
        // 5B. KARAOKE DIRECT STREAM PLAYBACK (GOOGLEVIDEO CDN DIRECT / MP4 / HLS / FLV)
        // =========================================================================
        async function playKaraokeDirectStream(media) {
            log('Loading Karaoke Direct Stream: ' + JSON.stringify(media));
            stopIptv();
            stopPhoto();
            if (ytPlayer && isYouTubeReady) {
                try { ytPlayer.stopVideo(); } catch (e) {}
            }
            ytPlayerContainer.style.display = 'none';
            if (splashScreen) splashScreen.style.display = 'none';

            currentMode = "KARAOKE_DIRECT";
            rewardAudio.pause();
            rewardAudio.currentTime = 0;
            rewardShown = false;

            const customData = media.customData || {};
            const streamUrl = customData.streamUrl || media.contentId;
            const audioUrl = customData.audioUrl || "";
            
            // Tìm ID dự phòng
            const fallbackRaw = customData.videoId || media.contentId;
            const fallbackVideoId = window.extractYouTubeId(fallbackRaw) || (fallbackRaw.length === 11 ? fallbackRaw : null);
            
            currentViewerName = customData.viewerName || "";

            if (currentViewerName) {
                viewerOverlay.textContent = `Trình bày: ${currentViewerName}`;
                viewerOverlay.style.opacity = 1;
                setTimeout(setMarquee, 0);
            } else {
                viewerOverlay.textContent = "";
                viewerOverlay.style.opacity = 0;
            }

            // Hiển thị khung phát Video trực tiếp không hiện biểu ngữ IPTV
            iptvContainer.style.display = 'block';
            iptvBanner.style.display = 'none';

            resetVideoElement();

            const existingAudio = document.getElementById('iptv-audio');
            if (existingAudio) {
                existingAudio.pause();
                existingAudio.removeAttribute('src');
                existingAudio.remove();
            }

            let playedSuccessfully = false;

            const onErrorHandler = () => {
                if (!playedSuccessfully && fallbackVideoId) {
                    log('Direct stream failed, falling back to YouTube player with videoId: ' + fallbackVideoId);
                    stopIptv();
                    loadVideoFromMessage({ contentId: fallbackVideoId, customData: customData });
                }
            };
            iptvVideo.onerror = onErrorHandler;

            try {
                if (audioUrl) {
                    log('Playing adaptive high-res stream with separate video and audio URLs on TV...');
                    iptvVideo.muted = true;
                    iptvVideo.src = streamUrl;
                    iptvVideo.load();

                    const audioEl = document.createElement('audio');
                    audioEl.id = 'iptv-audio';
                    audioEl.playsInline = true;
                    audioEl.muted = false;
                    audioEl.volume = 1.0;
                    audioEl.src = audioUrl;
                    iptvContainer.appendChild(audioEl);

                    iptvVideo.onplay = () => { playedSuccessfully = true; audioEl.play().catch(e => log('Audio play sync error: ' + e.message)); };
                    iptvVideo.onpause = () => { audioEl.pause(); };
                    iptvVideo.onseeking = () => { audioEl.currentTime = iptvVideo.currentTime; };
                    iptvVideo.onratechange = () => { audioEl.playbackRate = iptvVideo.playbackRate; };

                    await iptvVideo.play();
                    await audioEl.play();
                    playedSuccessfully = true;
                } else {
                    const headersObj = customData.headers || {};
                    if (customData.userAgent) headersObj['User-Agent'] = customData.userAgent;
                    if (customData.referrer) headersObj['Referer'] = customData.referrer;
                    
                    const channelData = { streamUrl: streamUrl, manifestType: customData.manifestType || "", headers: headersObj };
                    const lowerUrl = (streamUrl || "").toLowerCase();
                    let success = false;
                    
                    // Thử mọi bộ phát tùy định dạng thay vì chỉ giới hạn HLS
                    if (lowerUrl.includes('.flv') || channelData.manifestType === 'flv') {
                        success = await playWithMpegts(streamUrl, channelData);
                        if (!success) success = await playWithFlvJs(streamUrl, channelData);
                    } else if (lowerUrl.includes('.m3u8')) {
                        success = await playWithHlsJs(streamUrl, channelData);
                    } else if (lowerUrl.includes('.mpd')) {
                        success = await playWithShaka(streamUrl, channelData);
                    } else {
                        success = await playWithNativeVideo(streamUrl, channelData);
                    }
                    
                    if (success) {
                        playedSuccessfully = true;
                    } else if (fallbackVideoId) {
                        log('Direct stream playback failed, falling back to YouTube player...');
                        stopIptv();
                        loadVideoFromMessage({ contentId: fallbackVideoId, customData: customData });
                    }
                }
            } catch (err) {
                log('Exception in playKaraokeDirectStream: ' + err.message);
                if (!playedSuccessfully && fallbackVideoId) {
                    stopIptv();
                    loadVideoFromMessage({ contentId: fallbackVideoId, customData: customData });
                }
            }
        }

        // =========================================================================
        // 6. YOUTUBE LOAD VIDEO
        // =========================================================================
        function loadVideoFromMessage(media) {
            log('Loading YouTube video from message: ' + JSON.stringify(media));
            stopIptv();
            stopPhoto();
            currentMode = "YOUTUBE";

            ytPlayerContainer.style.display = 'block';
            rewardAudio.pause();
            rewardAudio.currentTime = 0;

            if (window.progressInterval) {
                clearInterval(window.progressInterval);
                window.progressInterval = null;
            }

            rewardShown = false;
            currentTime = 0;
            videoDuration = 0;

            if (splashScreen) splashScreen.style.display = 'none';

            // [SỬA LỖI YOUTUBE FULL LINK] Sử dụng extractYouTubeId thay vì đọc thẳng
            const rawVideoId = media.contentId || (media.customData && media.customData.videoId);
            const videoId = window.extractYouTubeId(rawVideoId) || rawVideoId;

            if (isYouTubeReady && ytPlayer && videoId) {
                ytPlayer.loadVideoById({ videoId: videoId, suggestedQuality: 'hd1080' });
            } else if (videoId) {
                window.pendingYouTubeVideoId = videoId;
            }

            currentViewerName = media.customData ? media.customData.viewerName : null;
            if (currentViewerName) {
                viewerOverlay.textContent = `Trình bày: ${currentViewerName}`;
                viewerOverlay.style.opacity = 1;
                setTimeout(setMarquee, 0);
            } else {
                viewerOverlay.textContent = "";
                viewerOverlay.style.opacity = 0;
                viewerOverlay.style.animation = "none";
            }
        }

        // =========================================================================
        // 7. CUSTOM MESSAGE LISTENER
        // =========================================================================
        context.addCustomMessageListener(CUSTOM_NAMESPACE, event => {
            const data = event.data;
            log(`Received custom message from sender: ${JSON.stringify(data)}`);

            if (data.type === "PLAY_IPTV") {
                playIptvChannel(data);
            } else if (data.type === "STOP_IPTV") {
                stopIptv();
            } else if (data.type === "PAUSE_IPTV") {
                pauseIptv();
            } else if (data.type === "RESUME_IPTV") {
                resumeIptv();
            } else if (data.type === "TOGGLE_IPTV") {
                if (iptvVideo.paused) resumeIptv(); else pauseIptv();
            } else if (data.type === "CYCLE_ASPECT_RATIO") {
                cycleAspectRatio();
            } else if (data.type === "SHOW_OSD") {
                if (activeChannelData) {
                    showIptvBanner(activeChannelData);
                } else {
                    showIptvBanner(data);
                }
            } else if (data.type === "SHOW_PHOTO") {
                showPhoto(data);
            } else if (data.type === "ROTATE_PHOTO") {
                rotatePhoto(data.rotation || 0);
            } else if (data.type === "STOP_PHOTO") {
                stopPhoto();
            } else if (data.type === "PLAY_LOCAL_VIDEO") {
                playLocalVideo(data);
            } else if (data.type === "JUMP_TO" || data.type === "PLAY_NEXT") {
                if (data.media) {
                    loadVideoFromMessage(data.media);
                }
            } else if (data.type === "REWARD_NOTIFICATION_STATUS") {
                window.rewardNotificationEnabled = data.enabled;
            }
        });

        // [MỚI] HÀM DỌN DẸP SẠCH BỘ NHỚ VÀ TÀI NGUYÊN GPU TIVI (HARD CLEANUP)
        function hardCleanupAllPlayers() {
            log('Executing hardCleanupAllPlayers: Clearing all player instances, memory and GPU resources...');
            cleanupCurrentIptvPlayer();
            const existingAudio = document.getElementById('iptv-audio');
            if (existingAudio) {
                try {
                    existingAudio.pause();
                    existingAudio.removeAttribute('src');
                    existingAudio.load();
                    existingAudio.remove();
                } catch (e) {}
            }
            if (typeof iptvContainer !== 'undefined' && iptvContainer) {
                iptvContainer.style.display = 'none';
            }
            if (typeof iptvVideo !== 'undefined' && iptvVideo) {
                try {
                    iptvVideo.pause();
                    iptvVideo.removeAttribute('src');
                    iptvVideo.load();
                } catch (e) {}
            }
            if (typeof ytPlayer !== 'undefined' && ytPlayer && typeof ytPlayer.stopVideo === 'function') {
                try {
                    ytPlayer.stopVideo();
                    ytPlayer.clearVideo();
                } catch (e) {}
            }
            if (typeof ytPlayerContainer !== 'undefined' && ytPlayerContainer) {
                ytPlayerContainer.style.display = 'none';
            }
            if (typeof stopPhoto === 'function') {
                try { stopPhoto(); } catch (e) {}
            }
            if (typeof hideIptvLoading === 'function') hideIptvLoading();
            if (typeof iptvBanner !== 'undefined' && iptvBanner) {
                iptvBanner.classList.remove('visible');
            }
            if (typeof viewerOverlay !== 'undefined' && viewerOverlay) {
                viewerOverlay.style.opacity = 0;
            }
            if (typeof currentMode !== 'undefined') {
                currentMode = "IDLE";
            }
        }

        // =========================================================================
        // 8. CAF RECEIVER INTERCEPTORS
        // =========================================================================
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            async loadRequestData => {
                log('Standard LOAD command received: ' + JSON.stringify(loadRequestData.media));
                
                // [MỚI] Hard cleanup all players and GPU resources before loading new content
                hardCleanupAllPlayers();
                
                // Small delay (150ms) to ensure memory/GPU cleanup completes and prevents black screen
                await new Promise(resolve => setTimeout(resolve, 150));

                const media = loadRequestData.media;
                if (!media) return null;

                const customData = media.customData || {};
                const contentType = (media.contentType || "").toLowerCase();
                const contentId = media.contentId || "";
                const contentIdLower = contentId.toLowerCase();

                // [MỚI] Xác định Video ID Youtube để tránh bị bắt nhầm vào nhánh IPTV
                const ytId = window.extractYouTubeId(contentId) || window.extractYouTubeId(customData.videoId) || window.extractYouTubeId(customData.streamUrl);
                const isYouTubeMedia = ytId !== null && (contentIdLower.includes('youtube.com') || contentIdLower.includes('youtu.be') || contentId.length === 11 || (customData && customData.videoId));
                const forceYouTube = customData.mediaType === "YOUTUBE" || customData.type === "PLAY_YOUTUBE";

                // Case A: Local Photo
                if (customData.mediaType === "LOCAL_PHOTO" || customData.type === "SHOW_PHOTO") {
                    showPhoto(customData);
                    return null;
                }

                // Case B: Local Video
                if (customData.mediaType === "LOCAL_VIDEO" || customData.type === "PLAY_LOCAL_VIDEO") {
                    playLocalVideo(customData);
                    return null;
                }
                
                // Case C: Youtube Link Override (Cứu lỗi "Không nhận diện được link Youtube do chứa http://")
                if (forceYouTube || isYouTubeMedia) {
                    loadVideoFromMessage(media);
                    return null;
                }

                // Case D: Karaoke Direct Stream (GoogleVideo Direct CDN / MP4 / HLS)
                if (customData.isDirectStream === true || customData.mediaType === "KARAOKE_DIRECT") {
                    playKaraokeDirectStream(media);
                    return null;
                }

                // Case E: IPTV stream request (Đã bổ sung Headers)
                if (customData.mediaType === "IPTV" || customData.type === "PLAY_IPTV" ||
                    contentType.includes("dash") || contentType.includes("mpegurl") ||
                    contentType.includes("flv") || contentType.includes("mp2t") ||
                    contentIdLower.includes('.m3u8') || contentIdLower.includes('.flv') || contentIdLower.includes('.mpd') || contentIdLower.includes('.ts') ||
                    contentIdLower.startsWith("http://") || contentIdLower.startsWith("https://")) {
                    
                    const headersObj = customData.headers || {};
                    if (customData.userAgent) headersObj['User-Agent'] = customData.userAgent;
                    if (customData.referrer) headersObj['Referer'] = customData.referrer;

                    const iptvData = {
                        streamUrl: customData.streamUrl || contentId,
                        channelName: customData.channelName || (media.metadata ? media.metadata.title : "Kênh IPTV"),
                        groupTitle: customData.groupTitle || (media.metadata ? media.metadata.subtitle : "Truyền hình 360TV"),
                        logoUrl: customData.logoUrl || (media.metadata && media.metadata.images && media.metadata.images[0] ? media.metadata.images[0].url : ""),
                        licenseKey: customData.licenseKey || "",
                        headers: headersObj,
                        manifestType: customData.manifestType || ""
                    };
                    playIptvChannel(iptvData);
                    return null;
                }

                // Default: YouTube Karaoke video
                loadVideoFromMessage(media);
                return null;
            }
        );

        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.PLAY,
            () => {
                if (currentMode === "IPTV") {
                    resumeIptv();
                } else if (ytPlayer) {
                    ytPlayer.playVideo();
                }
                return null;
            }
        );

        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.PAUSE,
            () => {
                if (currentMode === "IPTV") {
                    pauseIptv();
                } else if (ytPlayer) {
                    ytPlayer.pauseVideo();
                }
                return null;
            }
        );

        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.STOP,
            () => {
                if (currentMode === "IPTV") {
                    stopIptv();
                } else if (currentMode === "PHOTO") {
                    stopPhoto();
                } else if (ytPlayer) {
                    ytPlayer.stopVideo();
                }
                return null;
            }
        );

        // =========================================================================
        // 9. KARAOKE REWARD POPUP
        // =========================================================================
        function showRewardMessage(viewerName) {
            const startScore = 20;
            const finalScore = Math.floor(Math.random() * 16) + 85;
            let currentScore = startScore;

            rewardOverlay.innerHTML =
                `<div class="reward-text-blue">Ca sỹ ${viewerName} đã thể hiện bài hát rất tốt,</div>` +
                `<div class="reward-text-blue">điểm khen ngợi</div>` +
                `<div class="reward-score-red"><span id="score-counter">${startScore}</span> điểm</div>`;

            const scoreElement = document.getElementById('score-counter');
            rewardOverlay.style.opacity = 1;
            log(`Showing reward message for ${viewerName}. Counting from ${startScore} to ${finalScore}`);

            rewardAudio.currentTime = 0;
            rewardAudio.play().catch(e => log('Audio play error: ' + e.message));

            const counterInterval = setInterval(() => {
                if (currentScore < finalScore) {
                    currentScore++;
                    scoreElement.textContent = currentScore;
                } else {
                    clearInterval(counterInterval);
                }
            }, 50);

            setTimeout(() => {
                rewardOverlay.style.opacity = 0;
                clearInterval(counterInterval);
            }, 10000);
        }

        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        context.start(options);
        log('Cast receiver initialized and running successfully with YouTube Karaoke, IPTV 360TV & Local Media support.');
    </script>
